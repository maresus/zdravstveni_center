unsupported_symptoms:
  - id: "nujna_pomoc"
    keywords:
      - "nujno"
      - "hitro"
      - "bolečina"
      - "huda"
    response:
      - |
        Razumem, da imate težave.

        Za nujno medicinsko pomoč prosim pokličite **112** ali obiščite najbližji urgentni center.

        Zdravstveni center d.o.o. je diagnostični center — za naročanje na preiskave smo dosegljivi na **04 271 30 10** vsak dan od 07:00 do 18:00.
    quick_replies:
      - label: "Naroči se na preiskavo"
        value: "DA"
      - label: "Ne, hvala"
        value: "NE"
  - id: "splosna_medicina"
    keywords:
      - "splošni zdravnik"
      - "osebni zdravnik"
      - "zdravstveni dom"
    response: "Zdravstveni center d.o.o. je zasebni diagnostični center — ne nudimo splošne medicine. Za splošnega zdravnika se obrnite na Zdravstveni dom Kranj. Lahko vam pa pomagam z naročanjem na MR, RTG ali UZ preiskavo. Kaj potrebujete?"
    ui_override:
      type: "quick_replies"
      data:
        - {label: "MR preiskava", value: "MR"}
        - {label: "RTG slikanje", value: "RTG"}
        - {label: "Ultrazvok UZ", value: "UZ"}
        - {label: "Ščitnica", value: "SCITNICA"}
info_responses:
  pozdrav: |
    Pozdravljeni!

    Sem vaš digitalni pomočnik Zdravstveni center d.o.o. diagnostičnega centra. Kako vam lahko pomagam?

    Pomagam z informacijami o preiskavah (MR, RTG, UZ), čakalnih dobah, naročanjem ter ambulanto za bolezni ščitnice.
  kdo_si: |
    Sem digitalni pomočnik Zdravstveni center d.o.o. diagnostičnega centra v Kranju.

    Z veseljem odgovorim na vprašanja o naših preiskavah (MR, RTG, UZ), čakalnih dobah in naročanju.
  splosno: "Sem virtualni asistent zdravstvenega centra d.o.o.. Pomagam pri naročanju in informacijah o preiskavah MR, RTG, UZ in ambulanti za bolezni ščitnice."
  ekipa: |
    Naša strokovna ekipa:

    🩺 **dr. Maja Kokalj**, dr. med., spec. radiolog — nevroradiologija, odgovorna nosilka dejavnosti
    🩺 **dr. Andrej Vrečko**, dr. med., spec. radiolog — radiologija kostnomišičnega sistema
    🩺 **dr. Lea Bartol**, dr. med., spec. radiolog — radiologija trebušnih organov
    🩺 **dr. Klavdija Oblak**, dr. med., spec. internist — ambulanta za bolezni ščitnice

    Za termini ali vprašanja: 04 271 30 10 | info@zc-kranj.si
  hvala: "Hvala za zaupanje! Če boste še kaj potrebovali, sem tukaj za vas."
  pozdrav_variants:
    - "Živjo! Kako vam lahko danes pomagam?"
    - "Dober dan! Sem vaš digitalni asistent zdravstvenega centra d.o.o.. Kako lahko pomagam?"
  storitve_variants:
    - "Nudimo MR preiskave, RTG slikanje, UZ diagnostiko, UZ vodene posege in ambulanto za bolezni ščitnice. Kaj vas zanima?"
    - "Ponujamo: MR, RTG, UZ (samoplačniško), UZ vodene posege in tireološko ambulanto. Povejte, kaj iščete."
  cene_variants:
    - "Cene so odvisne od vrste preiskave. MR in RTG so po napotnici ZZZS ali samoplačniško. UZ preiskave so izključno samoplačniško. Napišite, katera preiskava vas zanima."
    - "Za točen znesek pokličite 04 271 30 10. UZ preiskave so samoplačniške, MR in RTG po napotnici ali samoplačniško."
  delovni_cas_variants:
    - "Delovni čas: vsak dan 07:00–19:00. Samoplačniške storitve: vsak dan 07:00–08:00 in 18:00–19:00, ob sobotah 07:00–09:00."
  kontakt_variants:
    - "MR/RTG/UZ: 04 271 30 10 | info@zc-kranj.si. Ščitnica: 04 271 30 15 | scitnica@zc-kranj.si. Naslov: Partizanska 12, Kranj."
  hvala_variants:
    - "Hvala! Če boste še kaj potrebovali, sem tukaj."
