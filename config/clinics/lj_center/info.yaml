version: 1
facts:
  lokacija:
    priority: fast
    category: LOKACIJA_INFO
    keywords:
      - kje
      - kje ste
      - kje vas najdemo
      - naslov
      - lokacija
      - nahajate
      - pridem
      - pridem do vas
    response:
      - |
        Najdete nas na naslovu **Partizanska cesta 12, 4000 Kranj**.
        Brezplačno parkirišče je urejeno neposredno pred vhodom (30 mest, vključno za invalide).
      - |
        Smo na **Partizanski cesti 12 v Kranju**.
        Dostopni z javnim prevozom (avtobus linija 1 in 3, postaja Partizanska — 2 min hoje).
      - |
        Naša lokacija je **Partizanska 12, Kranj**.
        Parkirišče pred objektom je brezplačno za naše paciente.

  kontakt:
    priority: fast
    category: KONTAKT_INFO
    keywords:
      - kontakt
      - telefon
      - telefonska
      - email
      - e-pošta
      - eposta
      - kako vas kontaktiram
      - kako pokličem
      - pokličem
    response: |
      📞 MR/RTG/UZ: **04 271 30 10** | info@zc-kranj.si
      📞 Ščitnica: **04 271 30 15** | scitnica@zc-kranj.si
      📍 Partizanska cesta 12, 4000 Kranj
      🕐 Vsak dan: 07:00–19:00

  delovni_cas:
    priority: fast
    category: DELOVNI_CAS_INFO
    keywords:
      - delovni čas
      - delovni cas
      - odprti
      - odprto
      - kdaj ste odprti
      - kdaj delate
      - urnik
    response:
      - |
        Delamo **vsak dan od 07:00 do 19:00**.
        Samoplačniške storitve: vsak dan 07:00–08:00 in 18:00–19:00, ob sobotah 07:00–09:00.
      - |
        Naš urnik: **vsak dan 07:00–19:00**
        Samoplačniške preiskave v razširjenem urniku: 07:00–08:00 in 18:00–19:00 ter sobote 07:00–09:00.

  parkiranje:
    priority: medium
    category: PARKIRANJE_INFO
    keywords:
      - parking
      - parkiranje
      - parkirišče
      - parkirisce
      - kje parkiram
    response: |
      Parkiranje je **brezplačno** za vse naše paciente.
      Parkirišče s 30 mesti (vključno s parkirnimi mesti za invalide) se nahaja neposredno pred vhodom.

  postopek_narocanja:
    priority: fast
    category: NAROCANJE_INFO
    keywords:
      - kako poteka naročanje
      - kako se naročim
      - kako naročim
      - postopek naročanja
      - kako rezerviram
      - postopek
    response:
      - |
        Naročanje je enostavno:

        📞 Pokličite **04 271 30 10** (MR/RTG/UZ) ali **04 271 30 15** (ščitnica)
        📧 Pišite na **info@zc-kranj.si** ali **scitnica@zc-kranj.si**
        🌐 Naročite prek spleta: www.zc-kranj.si/narocanje

        Za naročanje z napotnico ZZZS: cakalnedobe.ezdrav.si
      - |
        Kliknite **📅 Naroči se** v spodnjem delu pogovora.

        Potrebujemo vaše ime, telefon in vrsto preiskave — kontaktirali vas bomo za potrditev.

  cene:
    priority: fast
    category: CENE_INFO
    keywords:
      - cena
      - cene
      - cenik
      - koliko stane
      - kolk stane
      - cena pregleda
      - cena mr
      - cena rtg
      - cena uz
    response:
      - |
        Okvirne cene samoplačniških preiskav:

        🧲 **MR** — od 180 € do 320 € (odvisno od regije)
        ☢️ **RTG** — od 35 € do 75 €
        🔊 **UZ diagnostika** — od 65 € do 120 €
        💉 **UZ vodeni posegi** — od 150 € do 280 €
        🩺 **Ambulanta ščitnice** — od 80 € do 150 €

        Zavarovanci z napotnico ZZZS — brez doplačila.
        Za točen cenik pokličite **04 271 30 10**.
      - |
        Okvirni cenik (samoplačniško):

        🧲 MR glave/hrbtenice/kolena — ~180–320 €
        ☢️ RTG (en predel) — ~35–75 €
        🔊 UZ trebuha/dojk/ščitnice — ~65–120 €
        💉 UZ vodeni poseg — ~150–280 €

        Z napotnico ZZZS: brez doplačila za zavarovance.
        Točen cenik: **04 271 30 10** ali info@zc-kranj.si

  vodstvo:
    priority: fast
    category: PODJETJE_INFO
    keywords:
      - direktor
      - kdo je direktor
      - kdo vodi
      - vodja
      - vodstvo
      - lastnik
      - ustanovitelj
    response: |
      **Zdravstveni center d.o.o.** sta leta 2009 v Kranju ustanovila dva radiologa z vizijo sodobne in dostopne medicinske diagnostike.

      Za informacije pokličite **04 271 30 10** ali pišite na info@zc-kranj.si.

  ekipa:
    priority: fast
    category: PODJETJE_INFO
    keywords:
      - ekipa
      - zdravniki pri vas
      - kdo dela pri vas
      - tim
    response: |
      Zdravstveni center d.o.o. zaposluje izkušene radiologe, interniste in diplomirane zdravstvenike s specialistično izobrazbo.

      Za informacije o ekipi pokličite **04 271 30 10** ali pišite na info@zc-kranj.si.

  o_centru:
    priority: medium
    category: PODJETJE_INFO
    keywords:
      - o vas
      - o centru
      - kaj ste
      - kdo ste
      - kaj ponujate
      - opis
      - medilab
    response: |
      **Zdravstveni center d.o.o.** je zasebni diagnostični center v Kranju z več kot 15 let izkušnjami.

      Ponujamo:
      - 🧲 Magnetnoresonančna tomografija (MR)
      - ☢️ Rentgensko slikanje (RTG)
      - 🔊 Ultrazvočna diagnostika (UZ) — samoplačniško
      - 💉 UZ vodeni posegi — samoplačniško
      - 🩺 Ambulanta za bolezni ščitnice

      📍 Partizanska 12, Kranj | 📞 04 271 30 10

  service_mr:
    priority: low
    category: STORITVE_INFO
    keywords:
      - mr preiskava
      - magnetna resonanca
      - magnetnoresonančna
      - mri
    response: |
      **MR preiskave** — Zdravstveni center d.o.o.

      Izvajamo:
      - MR glave in vratu
      - MR hrbtenice (vratna, prsna, ledvena)
      - MR sklepov (rama, koleno, gleženj, kolk, zapestje)
      - MR artrografija
      - MR trebuha, medenice, prostate, dojk
      - MR angiografija (žilje)

      📞 Naročanje: **04 271 30 10** | info@zc-kranj.si

  service_rtg:
    priority: low
    category: STORITVE_INFO
    keywords:
      - rtg
      - rentgen
      - rentgensko
    response: |
      **RTG slikanje** — Zdravstveni center d.o.o.

      Izvajamo RTG slikanje kosti, skletnih struktur, prsnega koša in trebuha.
      Preiskava je hitra (5–10 min) in neboleča.

      📞 Naročanje: **04 271 30 10** | info@zc-kranj.si

  service_uz:
    priority: low
    category: STORITVE_INFO
    keywords:
      - uz
      - ultrazvok
      - ultrazvočni
      - ultrazvočna
    response: |
      **Ultrazvočna diagnostika (UZ)** — Zdravstveni center d.o.o.

      Izvajamo:
      - UZ trebuha
      - UZ sečil in medenice
      - UZ ščitnice
      - UZ dojk
      - UZ sklepov in mehkih tkiv
      - UZ žil (Doppler)

      UZ preiskave so **izključno samoplačniške**.
      📞 Naročanje: **04 271 30 10** | info@zc-kranj.si

  service_scitnica:
    priority: fast
    category: STORITVE_INFO
    keywords:
      - ščitnica
      - scitnica
      - ambulanta ščitnice
      - bolezni ščitnice
      - hipertiroidizem
      - hipotiroidizem
      - hipotiroza
      - hipertiroza
      - ščitnična
      - tireolog
      - golša
    response: |
      🩺 **Ambulanta za bolezni ščitnice** — Zdravstveni center d.o.o.

      Zdravimo:
      - Difuzno povečano in vozličasto žlezo (golša)
      - Prekomerno izločanje ščitničnih hormonov (hipertiroidizem)
      - Zmanjšano izločanje ščitničnih hormonov (hipotiroidizem)
      - Vozliče in ciste ščitnice

      📞 Naročanje: **04 271 30 15** | scitnica@zc-kranj.si
      🕐 Ordinacijski čas: pon–pet 08:00–16:00

  napotnica:
    priority: fast
    category: CENE_INFO
    keywords:
      - brez napotnice
      - samoplačniško
      - samoplačniski
      - samoplačnik
      - zasebno
      - brez napotice
      - zzzs
      - napotnica
      - z napotnico
    response: |
      **Napotnica ZZZS ali samoplačniško?**

      ✅ **Z napotnico ZZZS** — preiskava je brezplačna za zavarovance (pokrita z obveznim zdravstvenim zavarovanjem).
      💳 **Samoplačniško (brez napotnice)** — plačate po veljavnem ceniku:
         🧲 MR: 180–320 € | ☢️ RTG: 35–75 € | 🔊 UZ: 65–120 €

      Za samoplačniške preiskave napotnica ni potrebna — naročite se neposredno.
      📞 **04 271 30 10** | info@zc-kranj.si

  zdravstveni_nasvet_splosno:
    priority: medium
    category: ZDRAVSTVENI_NASVET
    keywords:
      - nasvet
      - kaj naj naredim
      - kako si pomagam
      - splošni nasvet
    response: |
      Z veseljem vas usmerim k pravi preiskavi ali specialistu.

      ⚠️ *Napomnik: nasveti, ki jih dajem, niso zdravniški nasvet ali diagnoza. Za natančno oceno vašega stanja vedno obiščite zdravnika.*
